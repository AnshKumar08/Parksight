server.port=8080

spring.application.name=parksight-backend

python.api.url=${PYTHON_API_URL:https://parksight-ai-engine.onrender.com/predict_hotspots}
python.api.connect-timeout=${PYTHON_CONNECT_TIMEOUT:5000}
python.api.read-timeout=${PYTHON_READ_TIMEOUT:30000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

logging.level.com.parksight=DEBUG
logging.level.org.springframework.web=INFO

